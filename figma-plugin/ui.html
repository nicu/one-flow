<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OneFlow Exporter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }
      button {
        padding: 8px 12px;
      }
      #out {
        word-break: break-all;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div>
      <button id="export">Export Selection as OneFlow JSON</button>
      <div id="status"></div>
      <div id="out"></div>
    </div>

    <script>
      const exportBtn = document.getElementById("export");
      const status = document.getElementById("status");
      const out = document.getElementById("out");
      exportBtn.onclick = () => {
        status.textContent = "Requesting export...";
        parent.postMessage({ pluginMessage: { type: "export" } }, "*");
      };

      onmessage = (evt) => {
        const msg = evt.data && evt.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "result") {
          status.textContent = "Export ready";
          // create download link
          const blob = new Blob([msg.data], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          out.innerHTML = `<a href="${url}" download="oneflow-export.json">Download JSON</a>`;
        }
        if (msg.type === "error") {
          status.textContent = "Error: " + (msg.message || "");
        }
      };
    </script>
  </body>
</html>
